name: NOVA AI 구현 직원

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: 구현할 작업
        required: true
        type: string
      base_branch:
        description: PR 대상 브랜치
        required: true
        default: beta
        type: choice
        options:
          - beta
          - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nova-ai-coder-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-employee' && github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || 'beta' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Implement task and open draft PR
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AI_TASK: ${{ inputs.task }}
          AI_BASE_BRANCH: ${{ inputs.base_branch || 'beta' }}
        run: node .github/scripts/ai-coding-employee.mjs
