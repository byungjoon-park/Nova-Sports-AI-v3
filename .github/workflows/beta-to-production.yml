name: NOVA Beta to Production

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-beta-to-production
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build check
        working-directory: frontend
        run: npm run build

      - name: Promote beta to main
        run: |
          set -e
          git push origin HEAD:main
