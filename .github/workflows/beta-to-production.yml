name: NOVA Beta to Production

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-beta-to-production
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build check
        working-directory: frontend
        run: npm run build

      - name: Promote beta to main and publish update notice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main beta

          changed_files="$(git diff --name-only origin/main...origin/beta | sed '/^$/d' | head -80)"
          commit_subject="${COMMIT_SUBJECT%%$'\n'*}"

          git checkout -B main origin/main
          git merge --no-edit --no-ff origin/beta -m "Promote beta to Production"

          mkdir -p frontend/public
          export NOTICE_CHANGED_FILES="$changed_files"
          export NOTICE_COMMIT_SUBJECT="$commit_subject"
          export NOTICE_SHA="$GITHUB_SHA_VALUE"
          export NOTICE_CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python - <<'PY'
          import json, os

          files = [line.strip() for line in os.environ.get("NOTICE_CHANGED_FILES", "").splitlines() if line.strip()]
          subject = os.environ.get("NOTICE_COMMIT_SUBJECT", "").strip()

          def feature_name(path):
              if path.startswith("frontend/app/api/billing/") or "billing" in path:
                  return "결제 기능"
              if path.startswith("frontend/app/mobile/") or "Mobile" in path or "/mobile-" in path:
                  return "모바일 기능"
              if "notice" in path.lower() or "공지" in path:
                  return "공지사항 기능"
              if path.startswith("frontend/app/admin/"):
                  return "관리자 기능"
              if path.startswith("frontend/components/"):
                  return "서비스 화면 및 기능"
              if path.startswith("frontend/app/api/"):
                  return "서비스 API 기능"
              return "서비스 기능"

          features = []
          for path in files:
              name = feature_name(path)
              if name not in features:
                  features.append(name)

          if not features:
              features = ["서비스 기능"]

          # Keep the notice user-facing: describe the updated feature, never the source filenames.
          feature_text = " · ".join(features[:4])
          body = f"이번 업데이트로 {feature_text}이 업데이트되었습니다."
          if subject:
              clean_subject = subject.split(":", 1)[1].strip() if ":" in subject and subject.split(":", 1)[0].lower() in {"feat", "fix", "refactor", "chore", "docs"} else subject
              # Keep commit text only when it is already user-facing Korean.
              if clean_subject and any("가" <= ch <= "힣" for ch in clean_subject) and clean_subject not in {"Beta 업데이트"}:
                  body += f"\n\n업데이트 내용: {clean_subject}"

          notice = {
              "notice": {
                  "id": f"UPDATE-{os.environ.get('NOTICE_SHA', 'unknown')[:12]}",
                  "title": "서비스 업데이트 안내",
                  "body": body,
                  "type": "update",
                  "createdAt": os.environ.get("NOTICE_CREATED_AT", ""),
              }
          }
          with open("frontend/public/latest-notice.json", "w", encoding="utf-8") as f:
              json.dump(notice, f, ensure_ascii=False, indent=2)
          PY

          git add frontend/public/latest-notice.json
          git commit --allow-empty -m "docs: publish service update notice"
          git push origin main
