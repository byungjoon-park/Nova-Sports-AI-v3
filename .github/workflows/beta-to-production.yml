name: NOVA Beta to Production

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nova-beta-to-production
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build check
        working-directory: frontend
        run: npm run build

      - name: Promote beta to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_NUMBER="$(gh pr list             --repo "$REPO"             --base main             --head beta             --state open             --json number             --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create               --repo "$REPO"               --base main               --head beta               --title "Promote beta to Production"               --body "Automatically created after the beta production build passed.")"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$REPO" --json number --jq '.number')"
          fi

          gh pr merge "$PR_NUMBER"             --repo "$REPO"             --squash             --delete-branch=false             --subject "Promote beta to Production"             --body "Automatically merged after the beta production build passed."
